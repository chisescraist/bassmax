
name: BassMax VST3 para Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Configurar JUCE y CMake
        run: cmake -S . -B build -A x64

      - name: Compilar VST3
        run: cmake --build build --config Release --target TechHouseBassLab_VST3 --parallel 2

      - name: Comprobar que se genero el VST3
        shell: pwsh
        run: |
          $plugins = @(Get-ChildItem -Path "build" -Recurse -Directory -Filter "*.vst3")
          if ($plugins.Count -eq 0) {
            throw "No se encontro ningun directorio .vst3 en build."
          }

          $plugins | ForEach-Object {
            Write-Host "VST3 encontrado: $($_.FullName)"
          }

      - name: Preparar paquete descargable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

          $plugins = @(Get-ChildItem -Path "build" -Recurse -Directory -Filter "*.vst3")

          foreach ($plugin in $plugins) {
            Copy-Item -LiteralPath $plugin.FullName -Destination "dist" -Recurse -Force
          }

          if (-not (Get-ChildItem -Path "dist" -Directory -Filter "*.vst3")) {
            throw "No se pudo preparar el paquete VST3."
          }

      - name: Publicar plugin para descargar
        uses: actions/upload-artifact@v4
        with:
          name: BassMax-Windows-VST3
          path: dist/
          if-no-files-found: error
          retention-days: 30
